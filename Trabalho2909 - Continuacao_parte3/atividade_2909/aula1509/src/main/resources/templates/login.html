<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::head}, ~{::main})}">

<head>
    <th:block th:replace="~{fragments/head :: head('Login - Sistema de Vendas')}"></th:block>

    <style>
        .login-page{
            min-height: 75vh;
            background: linear-gradient(135deg, #3161df 0%, #0d5cbc 100%);
        }
        .login-card{
            border: 0;
            border-radius: 18px;
            overflow: hidden;
        }
        .lift{
            transition: transform .18s ease, box-shadow .18s ease;
        }
        .lift:hover{
            transform: translateY(-3px);
            box-shadow: 0 1.2rem 2.6rem rgba(0,0,0,.18) !important;
        }
        /* Ícone dentro do input */
        .input-icon{
            position: relative;
        }
        .input-icon .bi{
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(13,110,253,.85); /* primary */
            pointer-events: none;
        }
        .input-icon .form-control{
            padding-left: 44px;
        }
    </style>
</head>

<main>
    <section class="login-page d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-9 col-lg-6 col-xl-5">

                    <!-- Alert de erro (Bootstrap puro) -->
                    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                        <div class="d-flex gap-2 align-items-start">
                            <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                            <div>
                                <div class="fw-semibold">Erro na autenticação</div>
                                <div class="small">Usuário ou senha inválidos. Tente novamente.</div>
                            </div>
                        </div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div class="card login-card shadow-lg lift">
                        <!-- Header -->
                        <div class="p-4 text-white" style="background: rgba(13,110,253,1);">
                            <div class="d-flex align-items-center gap-3">
                                <div class="bg-white bg-opacity-25 rounded-circle d-flex align-items-center justify-content-center"
                                     style="width: 52px; height: 52px;">
                                    <i class="bi bi-shop fs-3"></i>
                                </div>
                                <div>
                                    <div class="small text-white-50 fw-semibold">Acesso ao sistema</div>
                                    <h1 class="h4 mb-0 fw-bold">Sistema de Vendas</h1>
                                </div>
                            </div>
                        </div>

                        <!-- Body -->
                        <div class="card-body p-4 p-md-5 bg-body">
                            <div class="text-center mb-4">
                                <div class="fw-semibold">Entrar</div>
                                <div class="text-secondary small">Use seu usuário e senha para continuar</div>
                            </div>

                            <form th:action="@{/login}" method="post" id="loginForm" novalidate>
                                <!-- CSRF -->
                                <input type="hidden" th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}" />

                                <!-- Usuário -->
                                <div class="mb-3">
                                    <label for="username" class="form-label fw-semibold">
                                        Usuário
                                    </label>
                                    <div class="input-icon">
                                        <i class="bi bi-person-fill"></i>
                                        <input type="text"
                                               class="form-control form-control-lg"
                                               id="username"
                                               name="username"
                                               placeholder="Digite seu usuário"
                                               required
                                               minlength="3"
                                               autofocus>
                                    </div>
                                    <div class="form-text">Mínimo de 3 caracteres.</div>
                                </div>

                                <!-- Senha -->
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-semibold">
                                        Senha
                                    </label>
                                    <div class="input-icon">
                                        <i class="bi bi-lock-fill"></i>
                                        <input type="password"
                                               class="form-control form-control-lg"
                                               id="password"
                                               name="password"
                                               placeholder="Digite sua senha"
                                               required
                                               minlength="3">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold" id="loginBtn">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>
                                    Entrar
                                </button>

                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <span class="text-secondary small">
                                        Não tem conta?
                                        <a th:href="@{/escolher-tipo-cadastro}" class="text-decoration-none fw-semibold">Cadastre-se</a>
                                    </span>

                                    <!-- Se você não quiser isso, pode remover -->
                                    <span class="text-secondary small">
                                        <i class="bi bi-shield-lock-fill me-1"></i> Seguro
                                    </span>
                                </div>
                            </form>
                        </div>

                        <div class="card-footer bg-white text-center py-3">
                            <span class="text-secondary small">
                                © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> • Sistema de Vendas
                            </span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>

</main>

</html>
