<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br"
      th:replace="~{layout :: layout(~{::head}, ~{::main})}">

<head th:replace="~{fragments/head :: head('Carrinho de Compras')}"></head>

<main>
    <div class="container my-4">

        <div id="global-error-container" class="position-fixed top-0 end-0 p-3"
             style="z-index: 1050; margin-top: 80px; max-width: 400px;">
        </div>

        <div class="card shadow-lg border-0">

            <div class="card-header bg-primary text-white text-center py-3">
                <h2 class="mb-0">
                    <i class="bi bi-cart-check-fill me-2"></i>
                    Carrinho de Compras
                </h2>
            </div>

            <div class="card-body">

                <div class="table-responsive mb-4">
                    <table class="table table-striped text-center align-middle">
                        <thead class="table-primary">
                        <tr>
                            <th>Produto</th>
                            <th>Valor Unitário</th>
                            <th>Qtd.</th>
                            <th>Total</th>
                            <th>Ações</th>
                        </tr>
                        </thead>

                        <tbody>

                        <tr th:each="item : ${itens}">
                            <td th:text="${item.produto.descricao}">Produto</td>

                            <td>
                                R$
                                <span th:text="${#numbers.formatDecimal(item.produto.valor, 2, 'POINT', 2, 'COMMA')}">
                                    0,00
                                </span>
                            </td>

                            <td>
                                <input type="number"
                                       min="1"
                                       step="1"
                                       class="form-control text-center qtd-input"
                                       th:value="${item.quantidade}"
                                       th:data-id="${item.produto.id}"
                                       style="width: 80px;">
                            </td>

                            <td>
                                R$
                                <span th:id="'total-' + ${item.produto.id}"
                                      th:text="${#numbers.formatDecimal(item.total, 2, 'POINT', 2, 'COMMA')}">
                                    0,00
                                </span>
                            </td>

                            <td>
                                <form th:action="@{/carrinho/remove/{id}(id=${item.produto.id})}" method="post">
                                    <input type="hidden" th:if="${_csrf != null}"
                                           th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button class="btn btn-danger btn-sm">
                                        <i class="bi bi-trash3-fill"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(itens)}">
                            <td colspan="5" class="text-muted fst-italic py-3">
                                <i class="bi bi-cart-x fs-4 me-2"></i>
                                Nenhum item no carrinho.
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>

                <div th:if="${!#lists.isEmpty(itens)}" class="mt-4">
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <h5>Total do Carrinho:</h5>
                            <p class="fw-bold fs-4 text-success">
                                <i class="bi bi-cash-coin me-1"></i>
                                R$
                                <span id="total-carrinho"
                                      th:text="${#numbers.formatDecimal(total, 2, 'POINT', 2, 'COMMA')}">
                                    0,00
                                </span>
                            </p>
                        </div>

                        <div class="col-md-6">
                            <h5>Finalizar Compra</h5>

                            <form th:action="@{/carrinho/finalizar}" method="post"
                                  class="row g-2" id="formFinalizarCompra">

                                <input type="hidden" th:if="${_csrf != null}"
                                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                                <!-- ADMIN: escolhe o cliente -->
                                <div class="col-12" th:if="${isAdmin}">
                                    <label for="clienteId" class="form-label">
                                        <i class="bi bi-person-badge-fill me-1"></i> Cliente
                                    </label>

                                    <select id="clienteId" name="clienteId" class="form-select" required>
                                        <option value="">Selecione um cliente</option>
                                        <option th:each="c : ${clientes}"
                                                th:value="${c.id}"
                                                th:text="${c.nomeExibicao}">
                                        </option>
                                    </select>
                                </div>

                                <!-- CLIENTE: mostra apenas o cliente logado -->
                                <div class="col-12" th:unless="${isAdmin}">
                                    <label class="form-label">
                                        <i class="bi bi-person-badge-fill me-1"></i> Cliente
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:value="${clienteLogado != null ? clienteLogado.nomeExibicao : 'Cliente não vinculado ao usuário'}"
                                           readonly>

                                    <!-- envia o id (opcional) - o controller do CLIENTE usa o usuario logado -->
                                    <input type="hidden" name="clienteId"
                                           th:if="${clienteLogado != null}"
                                           th:value="${clienteLogado.id}"/>
                                </div>

                                <div class="col-12 text-end">
                                    <button type="submit" class="btn btn-success px-4"
                                            th:disabled="${!isAdmin and clienteLogado == null}">
                                        <i class="bi bi-check2-circle me-2"></i>
                                        Finalizar Compra
                                    </button>
                                </div>

                                <div class="col-12" th:if="${!isAdmin and clienteLogado == null}">
                                    <div class="alert alert-warning mb-0">
                                        Este usuário não está vinculado a um cliente, então não é possível finalizar a compra.
                                    </div>
                                </div>

                            </form>
                        </div>

                    </div>
                </div>

            </div>
        </div>

        <div class="text-center mt-4">
            <a href="/produto/listVenda?from=carrinho" class="btn btn-secondary px-4">
                <i class="bi bi-arrow-left-circle me-2"></i>
                Continuar Comprando
            </a>
        </div>

    </div>

    <script>
        // Lê o token CSRF do <head> (adicionado no fragment head.html)
        function getCsrf() {
            const token = document.querySelector('meta[name="_csrf"]')?.getAttribute('content');
            const header = document.querySelector('meta[name="_csrf_header"]')?.getAttribute('content');
            return { token, header };
        }

        function formatarNumeroBR(valor) {
            const n = Number(valor);
            if (!Number.isFinite(n)) return '0,00';
            return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        document.querySelectorAll('.qtd-input').forEach(input => {
            let timeout = null;

            input.addEventListener('input', function () {
                clearTimeout(timeout);

                let valor = this.value.trim();
                const productId = this.dataset.id;
                const globalContainer = document.getElementById('global-error-container');
                let hasError = false;
                let errorMessage = '';

                // Validação: Quantidade é obrigatória
                if (!valor) {
                    hasError = true;
                    errorMessage = 'Quantidade é obrigatória';
                    this.classList.add('is-invalid');
                }
                // Validação: Apenas números inteiros (sem decimais)
                else if (valor.includes('.') || valor.includes(',')) {
                    hasError = true;
                    errorMessage = 'Apenas números inteiros são permitidos';
                    this.value = '';
                    this.classList.add('is-invalid');
                }
                // Validação: Quantidade deve ser positiva
                else {
                    let qtdInt = Number.parseInt(valor, 10);
                    if (!Number.isFinite(qtdInt) || qtdInt < 1) {
                        hasError = true;
                        errorMessage = 'Quantidade deve ser um número inteiro positivo';
                        this.value = '';
                        this.classList.add('is-invalid');
                    } else {
                        this.classList.remove('is-invalid');
                    }
                }

                // Exibir ou ocultar mensagem de erro no container global
                if (hasError) {
                    this.classList.add('is-invalid');

                    let existingAlert = document.getElementById('error-alert-' + productId);
                    if (!existingAlert) {
                        const alertDiv = document.createElement('div');
                        alertDiv.id = 'error-alert-' + productId;
                        alertDiv.className = 'alert alert-danger d-flex justify-content-between align-items-center mb-2 alert-dismissible fade show';
                        alertDiv.setAttribute('role', 'alert');
                        alertDiv.innerHTML = `
                            <span>
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span>${errorMessage}</span>
                            </span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        `;
                        globalContainer.appendChild(alertDiv);
                    } else {
                        existingAlert.innerHTML = `
                            <span>
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span>${errorMessage}</span>
                            </span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        `;
                    }
                    return;
                } else {
                    this.classList.remove('is-invalid');
                    const existingAlert = document.getElementById('error-alert-' + productId);
                    if (existingAlert) existingAlert.remove();
                }

                timeout = setTimeout(async () => {
                    let qtdInt = Number.parseInt(valor, 10);

                    const { token, header } = getCsrf();
                    const headers = {
                        'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                    };
                    if (token && header) {
                        headers[header] = token;
                    }

                    try {
                        const resp = await fetch('/carrinho/update/' + productId, {
                            method: 'POST',
                            headers,
                            body: new URLSearchParams({ quantidade: String(qtdInt) }),
                            credentials: 'same-origin'
                        });

                        if (!resp.ok) {
                            console.error('Fal
